iconFile="anye_icon.png"
bannerFile="anye_banner.png"
# A text field displayed in the mod UI
#credits="" #optional
authors="[AnYe]AnMao(s)"
description="""
Website:https://anye.dev
GitHub:https://github.com/An-Mao/MC-Cores
"""

[[mixins]]
config="mixins.${mod_id}.json"


[[dependencies.${mod_id}]]
